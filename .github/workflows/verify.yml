name: Verify browser prototype
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-checks-${{ matrix.os }}
          path: verification/
          retention-days: 14
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [crossing_browser, regression09_browser, cutaway_browser, reflection_browser, native_origin_browser, starter_browser, camera_browser, pursuit_browser, characters_browser, classes_browser, cosmos_browser, earth_browser, earth_story_browser, earth_notes_browser, gathering_browser, realm_atlas_browser, timber_browser, traveler_browser, bridge_browser, combat_cue_browser, world_foundations_browser, world_cutaway_browser]
    runs-on: ubuntu-latest
    # The full campaign + creative/export journey exceeds 12 minutes on hosted
    # software WebGL with the refined geometry. Keep all assertions and bound it.
    timeout-minutes: ${{ matrix.suite == 'regression09_browser' && 20 || 12 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # Each suite uses checked-in fixtures and current HTML independently.
      # Source/build identity is checked by the source jobs above.
      - run: python tests/${{ matrix.suite }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-checks-${{ matrix.suite }}
          path: |
            verification/
            evidence10/
            evidence07/regression/
          retention-days: 14
