name: Verify browser prototype
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python tools/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-checks-${{ matrix.os }}
          path: verification/
          retention-days: 14
  supplied-load:
    runs-on: ubuntu-latest
    # Ordinary-RAF route following uses real time; this is a controller budget.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build and earn current original expedition prerequisites
        shell: bash
        run: |
          set -euo pipefail
          task_sources="${RUNNER_TEMP}/firstlight-consignment-earned"
          python -B build.py
          git diff --exit-code -- index.html FIRSTLIGHT_VALLEY.html
          node tests/earth_expedition_journey.cjs --output "$task_sources"
          node tests/earth_expedition_journey.cjs --bow --output "$task_sources"
          node tests/earth_expedition_journey.cjs --veteran --output "$task_sources"
          python -B tools/earth_consignment_cohort.py --root "$GITHUB_WORKSPACE" --sources "$task_sources" --output "$task_sources/FIRST_LOAD_COHORT.json"
      - name: Require current intake and six native routes plus refusal cases
        shell: bash
        run: |
          set -euo pipefail
          task_sources="${RUNNER_TEMP}/firstlight-consignment-earned"
          export FIRSTLIGHT_ROOT="$GITHUB_WORKSPACE"
          export FIRSTLIGHT_CONSIGNMENT_COHORT="$task_sources/FIRST_LOAD_COHORT.json"
          python -B tests/test_earth_consignment_browser.py -v
          python -B tools/earth_consignment_browser.py --root "$GITHUB_WORKSPACE" --cohort "$FIRSTLIGHT_CONSIGNMENT_COHORT" --output "${RUNNER_TEMP}/firstlight-consignment-native" --renderer software
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: supplied-load-native-checks
          # Retain inputs, writes, reports and stills; no full games or movies.
          path: |
            ${{ runner.temp }}/firstlight-consignment-earned/**/*.json
            ${{ runner.temp }}/firstlight-consignment-native/**/*.json
            ${{ runner.temp }}/firstlight-consignment-native/**/*.png
          retention-days: 7
  cosmos-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/cosmos_campaign_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cosmos-campaign-native-checks
          path: evidence10/cosmos-campaign-native*/
          retention-days: 14
  atlantis-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/atlantis_campaign_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: atlantis-campaign-native-checks
          path: evidence10/atlantis-campaign-native*/
          retention-days: 14
  heaven-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/heaven_campaign_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: heaven-campaign-native-checks
          path: evidence10/heaven-campaign-native*/
          retention-days: 14
  hell-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/hell_campaign_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hell-campaign-native-checks
          path: evidence10/hell-campaign-native*/
          retention-days: 14
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [bridge_community_browser, home_history_browser, crossing_browser, regression09_browser, cutaway_browser, reflection_browser, native_origin_browser, starter_browser, camera_browser, pursuit_browser, characters_browser, classes_browser, cosmos_browser, earth_browser, earth_story_browser, earth_notes_browser, gathering_browser, realm_atlas_browser, timber_browser, traveler_browser, bridge_browser, combat_cue_browser, world_foundations_browser, world_cutaway_browser, realm_trails_browser, realm_trails_north_browser, realm_trails_cosmos_browser, soundscape_browser, journey_usability_browser, workshop_transactions_browser, companion_presentation_browser, skitter_presentation_browser, coastward_scenery_browser, realm_givers_browser, earth_story_transactions_browser, coastward_bridge_posts_browser, practice_visibility_browser, realm_work_presentation_browser, earth_expedition_browser, earth_ground_material_browser, local_life_browser]
    runs-on: ubuntu-latest
    # Campaign/export, eleven-giver tours and 48 full local-life restarts need
    # a larger bounded window on software WebGL. Preserve every route/assertion.
    timeout-minutes: ${{ (matrix.suite == 'regression09_browser' || matrix.suite == 'realm_givers_browser' || matrix.suite == 'local_life_browser') && 20 || 12 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      # Each suite uses checked-in fixtures and current HTML independently.
      # Source/build identity is checked by the source jobs above.
      - run: python tests/${{ matrix.suite }}.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-checks-${{ matrix.suite }}
          path: |
            verification/
            evidence10/
            evidence07/regression/
          retention-days: 14
